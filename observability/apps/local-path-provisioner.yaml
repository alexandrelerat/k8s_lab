# Default StorageClass backed by a directory on each node's root disk, so Prometheus and
# Tempo can get PersistentVolumes without the AWS EBS CSI driver. The chart isn't
# published to a Helm repo, so it's pulled straight from the upstream git tag.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rancher/local-path-provisioner.git
    targetRevision: v0.0.37
    path: deploy/chart/local-path-provisioner
    helm:
      valuesObject:
        storageClass:
          defaultClass: true
          name: local-path
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # The chart sets `hostUsers: true`, a field the API server drops unless the
  # UserNamespacesSupport feature gate is on (it's off by default on 1.30), so the live
  # Deployment never matches.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: local-path-provisioner
      jqPathExpressions:
        - .spec.template.spec.hostUsers
