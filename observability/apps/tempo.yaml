# Grafana Tempo single binary: stores traces received from the OTel Collector and derives
# span metrics and a service graph from them, remote-written to Prometheus.
# (The chart moved from grafana/helm-charts to grafana-community/helm-charts in 2026.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: tempo
      targetRevision: 3.1.0
      helm:
        releaseName: tempo
        valueFiles:
          - $values/observability/values/tempo.yaml
    - repoURL: https://github.com/alexandrelerat/k8s_lab.git
      targetRevision: obs
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Child Applications sync in wave order but ArgoCD doesn't wait for one to be
    # healthy before starting the next, so CRDs (ServiceMonitor) or Services a chart
    # depends on may not exist yet on the first attempt. Retrying converges.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
