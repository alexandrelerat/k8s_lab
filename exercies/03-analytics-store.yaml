apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: analytics-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: analytics-data
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: analytics-storage
  local:
    path: /mnt/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-10-0-1-101
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analytics-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: analytics-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: analytics-store
spec:
  nodeSelector:
    kubernetes.io/hostname: cp-node
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: analytics-pvc
